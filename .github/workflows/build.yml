name: Build Electron App

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        type: string
        default: "main"

jobs:
  check_branch:
    runs-on: ubuntu-latest
    outputs:
      branch_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if branch exists
        id: check
        run: |
          if git rev-parse --verify ${{ github.event.inputs.branch }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_branch
    if: needs.check_branch.outputs.branch_exists == 'true'
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.10"]
        node-version: ["20.x"]

    steps:
      - uses: actions/checkout@v4

      # Python環境のセットアップ
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # Node.js環境のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # 依存関係のインストール
      - name: Install dependencies
        run: |
          npm ci
          cd ml && poetry install --no-root
          cd ../app && npm ci

      # Pythonスクリプトのビルド
      - name: Build Python scripts
        working-directory: ./ml
        run: |
          poetry run pip install pyinstaller
          ../build.sh

      # MLビルド成果物の確認
      - name: Check ML build artifacts
        run: |
          echo "=== Checking ML build artifacts ==="
          if exist "ml\dist\IF001.exe" (
            echo "✅ IF001.exe exists"
          ) else (
            echo "❌ IF001.exe not found"
            exit 1
          )
          if exist "ml\dist\IF002.exe" (
            echo "✅ IF002.exe exists"
          ) else (
            echo "❌ IF002.exe not found"
            exit 1
          )
          if exist "ml\dist\IF003.exe" (
            echo "✅ IF003.exe exists"
          ) else (
            echo "❌ IF003.exe not found"
            exit 1
          )
          if exist "ml\dist\IF004.exe" (
            echo "✅ IF004.exe exists"
          ) else (
            echo "❌ IF004.exe not found"
            exit 1
          )

      # Electronアプリのビルド
      - name: Build Electron app
        run: npm run make

      - name: Check Electron build artifacts
        shell: pwsh
        run: |
          echo "=== Checking Electron build artifacts ==="
          $zip = Get-ChildItem -Path "app\out\make" -Recurse -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            echo "✅ Electron installer exists: $($zip.FullName)"
          } else {
            echo "❌ Electron installer ZIP not found"
            exit 1
          }

      # ビルド成果物のアップロード
      # いったんコメントアウトしておく
